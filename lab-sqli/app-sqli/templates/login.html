<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>B&B Seguros</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; text-align: center;}
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        .erro { color: #b00020; }
        .ok { color: #0a5; }
        .flag { color: #0a7d1f; font-weight: bold; background: #eaffea;
                padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h2>B&B Seguros</h2>
    <p>Busque a sua segurança no B&B Seguros!</p>
    <form method="POST">
        <input type="text" name="usuario" placeholder="usuário" required>
        <input type="text" name="senha" placeholder="senha" required>
        <button type="submit">Entrar</button>
    </form>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    {% if mensagem %}<p class="ok">{{ mensagem }}</p>{% endif %}
    {% if flag %}
        <p class="flag">Login de administrador realizado!<br>{{ flag }}</p>
    {% endif %}
    <p><a href="/busca">Diretório de funcionários</a></p>
</body>
</html>
