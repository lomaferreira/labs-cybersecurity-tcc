services:
  servidor:
    build: ./servidor
    ports:
      - "5002:5000"
      - "5443:5443"
    networks:
      - lab-net

  vitima:
    build: ./vitima
    networks:
      - lab-net
    depends_on:
      - servidor

  atacante:
    build: ./atacante
    cap_add:
      - NET_ADMIN     # necessário para o arpspoof/tcpdump manipularem pacotes brutos
      - NET_RAW       # necessário para o arpspoof/tcpdump manipularem pacotes brutos
    sysctls:
      - net.ipv4.ip_forward=1   # habilita o encaminhamento de pacotes já na criação do
                                 # container — sem isso /proc/sys fica somente leitura
                                 # mesmo com NET_ADMIN, e o aluno não consegue habilitá-lo
                                 # depois via echo/sysctl
    networks:
      - lab-net
    depends_on:
      - servidor
      - vitima

networks:
  lab-net:
