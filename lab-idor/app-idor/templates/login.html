<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>True Security</title>
    <style>
        body { font-family: sans-serif; max-width: 420px; margin: 80px auto; text-align: center; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        .erro { color: #b00020; }
    </style>
</head>
<body>
    <h2>True Security</h2>
    <p>Painel interno de funcionários</p>
    <form method="POST">
        <input type="text" name="usuario" placeholder="usuário" required>
        <input type="text" name="senha" placeholder="senha" required>
        <button type="submit">Entrar</button>
    </form>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
</body>
</html>
