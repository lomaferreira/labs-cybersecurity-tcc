<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>True Security</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; text-align: center;}
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        .erro { color: #b00020; }
        .flag { color: #0a7d1f; font-weight: bold; background: #eaffea;
                padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h2> True Security </h2>
    <p>Use uma senha que você conseguiu quebrar para logar.</p>
    <form method="POST">
        <input type="text" name="usuario" placeholder="usuário (ex: usuario_A)" required>
        <input type="text" name="senha" placeholder="senha" required>
        <button type="submit">Entrar</button>
    </form>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    {% if flag %}
        <p class="flag">Login bem-sucedido!<br>FLAG{{ '{' }}{{ flag }}{{ '}' }}</p>
    {% endif %}
</body>
</html>
