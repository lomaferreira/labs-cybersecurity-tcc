<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="4">
    <title>Painel do Atacante</title>
    <style>
        body { font-family: sans-serif; max-width: 760px; margin: 40px auto; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 14px; }
        th { background: #eee; }
        .flag { color: #0a7d1f; font-weight: bold; background: #eaffea;
                padding: 10px; border-radius: 6px; text-align: center; margin-top: 16px; }
        .vazio { text-align: center; color: #777; margin-top: 30px; }
    </style>
</head>
<body>
    <h2>Painel do Atacante</h2>

    {% if capturados %}
    <table>
        <tr>
        <th>Usuário</th>
        <th>Senha</th>
        <th>Cookie</th>
    </tr>

    {% for c in capturados %}
    <tr>
        <td>{{ c.usuario }}</td>
        <td>{{ c.senha }}</td>
        <td>{{ c.cookie }}</td>
    </tr>
        {% endfor %}
    </table>
    {% else %}
        <p class="vazio">Nenhum dado capturado ainda.</p>
    {% endif %}

    {% if flag %}
        <p class="flag">{{ flag }}</p>
    {% endif %}
</body>
</html>
