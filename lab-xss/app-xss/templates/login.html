<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>True Security</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; text-align: center;}
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        .aviso { background: #eef5ff; padding: 10px; border-radius: 6px; margin-bottom: 16px; }
        .msg { color: #333; }
    </style>
</head>
<body>
    <h2>True Security</h2>
    <p>Painel interno de funcionários</p>

    {% if aviso is not none %}
        <div class="aviso">
            {% if corrigido %}
                {{ aviso }}
            {% else %}
                {{ aviso|safe }}
            {% endif %}
        </div>
    {% endif %}

    <form method="POST">
        <input type="text" name="usuario" placeholder="usuário" required>
        <input type="text" name="senha" placeholder="senha" required>
        <button type="submit">Entrar</button>
    </form>
    {% if mensagem %}<p class="msg">{{ mensagem }}</p>{% endif %}
</body>
</html>
